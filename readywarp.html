<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadyWARP — ReadyStore</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --toolbar-blue:#2196F3;
    --toolbar-blue-dark:#1976D2;
    --bg:#EEEEEE;
    --card:#FFFFFF;
    --text-primary:#212121;
    --text-secondary:#757575;
    --text-hint:#9E9E9E;
    --accent-green:#0F9D58;
    --accent-green-dark:#0B8043;
    --divider:#E0E0E0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Roboto','Helvetica Neue',Arial,sans-serif;
    color:var(--text-primary);
    -webkit-font-smoothing:antialiased;
  }

  /* ===== TOOLBAR ===== */
  .toolbar{
    position:sticky;
    top:0;
    z-index:100;
    height:56px;
    background:var(--toolbar-blue);
    display:flex;
    align-items:center;
    padding:0 8px;
    box-shadow:0 2px 4px -1px rgba(0,0,0,.2), 0 4px 5px 0 rgba(0,0,0,.14), 0 1px 10px 0 rgba(0,0,0,.12);
    color:#fff;
  }
  .back-btn{
    width:40px;height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    cursor:pointer;
    transition:background .15s ease;
  }
  .back-btn:hover{background:rgba(255,255,255,.12);}
  .toolbar-title{
    font-size:18px;
    font-weight:500;
    letter-spacing:.01em;
    margin-left:8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* ===== APP HEADER ===== */
  .app-header{
    max-width:900px;
    margin:0 auto;
    background:var(--card);
    padding:24px 20px;
    display:flex;
    gap:20px;
    box-shadow:0 1px 2px rgba(0,0,0,.14);
  }
  .app-icon{
    width:96px;height:96px;
    border-radius:16px;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .app-header-text{flex:1;min-width:0;padding-top:2px;}
  .app-title{
    font-size:24px;
    font-weight:400;
    margin:0 0 4px;
  }
  .app-dev{
    font-size:14px;
    color:var(--toolbar-blue-dark);
    margin:0 0 12px;
  }
  .app-stats{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
  }
  .stat{
    display:flex;
    flex-direction:column;
  }
  .stat-value{
    font-size:14px;
    font-weight:500;
    color:var(--text-primary);
  }
  .stat-label{
    font-size:11px;
    color:var(--text-hint);
    margin-top:2px;
  }

  /* ===== DOWNLOAD BAR ===== */
  .download-bar{
    max-width:900px;
    margin:1px auto 0;
    background:var(--card);
    padding:0 20px 24px;
    box-shadow:0 1px 2px rgba(0,0,0,.14);
  }
  .btn-install-big{
    appearance:none;
    border:none;
    background:var(--accent-green);
    color:#fff;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    letter-spacing:.03em;
    text-transform:uppercase;
    text-decoration:none;
    padding:12px 28px;
    border-radius:2px;
    cursor:pointer;
    display:inline-block;
    box-shadow:0 1px 2px rgba(0,0,0,.2);
    transition:background .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .btn-install-big:hover{
    background:var(--accent-green-dark);
    box-shadow:0 2px 5px rgba(0,0,0,.26);
  }
  .btn-install-big:active{
    transform:scale(.97);
    box-shadow:0 1px 1px rgba(0,0,0,.2);
  }
  .download-hint{
    font-size:12px;
    color:var(--text-hint);
    margin:10px 0 0;
  }

  /* ===== SCREENSHOTS ===== */
  .section{
    max-width:900px;
    margin:16px auto 0;
    background:var(--card);
    padding:20px;
    box-shadow:0 1px 2px rgba(0,0,0,.14);
  }
  .section-title{
    font-size:15px;
    font-weight:500;
    margin:0 0 14px;
    color:var(--text-primary);
  }
  .screenshots{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .screenshots::-webkit-scrollbar{height:6px;}
  .screenshots::-webkit-scrollbar-thumb{background:var(--divider);border-radius:3px;}
  .shot-placeholder{
    flex-shrink:0;
    width:160px;
    height:280px;
    background:linear-gradient(160deg,#E8EAF6,#C5CAE9);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#5C6BC0;
    font-size:12px;
    text-align:center;
    padding:12px;
    border:1px solid var(--divider);
  }

  /* ===== DESCRIPTION ===== */
  .description{
    font-size:14px;
    line-height:1.7;
    color:var(--text-primary);
    margin:0;
    white-space:pre-line;
  }

  /* ===== FEATURE LIST ===== */
  .feature-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .feature-item{
    display:flex;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--divider);
  }
  .feature-item:last-child{border-bottom:none;}
  .feature-icon{
    width:24px;height:24px;
    flex-shrink:0;
    margin-top:1px;
  }
  .feature-text-title{
    font-size:14px;
    font-weight:500;
    margin:0 0 2px;
  }
  .feature-text-desc{
    font-size:13px;
    color:var(--text-secondary);
    margin:0;
    line-height:1.5;
  }

  /* ===== INFO TABLE ===== */
  .info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 24px;
  }
  @media(max-width:480px){
    .info-grid{grid-template-columns:1fr;}
  }
  .info-row-label{
    font-size:11px;
    color:var(--text-hint);
    margin:0 0 3px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .info-row-value{
    font-size:13px;
    color:var(--text-primary);
    margin:0;
  }

  .footer{
    text-align:center;
    padding:24px 16px 40px;
    font-size:12px;
    color:var(--text-hint);
  }
</style>
</head>
